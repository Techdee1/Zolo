services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zolo
      POSTGRES_PASSWORD: zolo
      POSTGRES_DB: zolo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zolo -d zolo"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://zolo:zolo@postgres:5432/zolo
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-me-dev-only-change-me}
      RP_ID: ${RP_ID:-localhost}
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_TOKEN: ${DEMO_TOKEN:-dev-demo-token}
    ports:
      - "8000:8000"

volumes:
  pgdata:
