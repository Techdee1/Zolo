[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# the URL comes from DATABASE_URL (see migrations/env.py), never from this file

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
