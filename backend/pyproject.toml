[project]
name = "zolo"
version = "0.1.0"
description = "Zolo: a voice-first consent layer. Anyone can propose a payment; only the account holder approves it."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "webauthn>=2.5",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "spitch>=1.50",  # AI package (zolo.ai)
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "hypothesis>=6.115",
    "ruff>=0.8",
    "mypy>=1.13",
    "imageio-ffmpeg",  # bundled ffmpeg for AI audio tests
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["zolo"]
branch = true
# SQLAlchemy's async layer runs queries in greenlets; without this, coverage misses those lines.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP047"]  # keep TypeVar helpers readable

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"migrations/*" = ["E501"]
"scripts/*" = ["E501"]  # the mutation table has long literal strings
"zolo/api/routes_dev.py" = ["E501"]  # the embedded test page has long JavaScript lines

[tool.mypy]
strict = true
files = ["zolo"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["imageio_ffmpeg", "spitch", "spitch.*"]
ignore_missing_imports = true
