[project]
name = "zolo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "spitch>=1.50"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy", "imageio-ffmpeg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
files = ["zolo/ai/nlu", "zolo/ai/stt", "zolo/ai/tts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP047"]  # keep TypeVar helpers readable

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
