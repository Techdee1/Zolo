# Zolo, one machine: Postgres, the API, the web app and Caddy (HTTPS). Only Caddy is public.
#
#   cp deploy/.env.example deploy/.env      # fill it in
#   docker compose -f deploy/compose.yml --env-file deploy/.env up -d --build
#
# This is a DEMO deployment: mock login, a mock bank and the demo console (see docs/DEPLOY.md).
name: zolo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zolo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: zolo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zolo -d zolo"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Migrate, seed only if the database is empty (a restart keeps everything), then serve.
    command:
      - sh
      - -c
      - alembic upgrade head && python -m zolo.seed --if-empty && exec uvicorn zolo.api.main:create_app --factory --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://zolo:${POSTGRES_PASSWORD}@postgres:5432/zolo
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET (openssl rand -hex 32)}
      # Passkeys belong to the FRONTEND's domain: the browser only ever talks to the web app.
      RP_ID: ${SITE_HOST:?set SITE_HOST to the host name only}
      ORIGIN: ${SITE_ORIGIN:?set SITE_ORIGIN, e.g. https://zolo.example.com}
      CORS_ORIGINS: ${SITE_ORIGIN}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_FORWARDED_FOR: "true"
      ENV: prod
      DEMO_MODE: "true"
      DEMO_TOKEN: ${DEMO_TOKEN:?set DEMO_TOKEN (8+ characters)}
      # Readback audio: render English and Pidgin when an agent asks, so any amount has a voice.
      AUDIO_PRERENDER_ON_CREATE: ${AUDIO_PRERENDER_ON_CREATE:-true}
      AUDIO_CACHE_DIR: /data/audio
      YARNGPT_API_KEY: ${YARNGPT_API_KEY:-}
      TTS_VOICE_EN: ${TTS_VOICE_EN:-idera}
      TTS_VOICE_PCM: ${TTS_VOICE_PCM:-idera}
    volumes:
      - audio:/data/audio
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_FEATURE_DEMO: "true"
        NEXT_PUBLIC_TEAM_NAME: ${TEAM_NAME:-}
        NEXT_PUBLIC_REPO_URL: ${REPO_URL:-}
        NEXT_PUBLIC_DEMO_VIDEO_URL: ${DEMO_VIDEO_URL:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      BACKEND_URL: http://api:8000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/signin').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  audio:
  caddy_data:
  caddy_config:
