# Render Blueprint, FREE plan version (a DEMO deployment: mock login, a mock bank, the demo console).
# In Render: New > Blueprint > pick this repo and branch, and set "Blueprint file path" to
# render.free.yaml. See docs/DEPLOY.md ("On Render, free plan") for what the free plan costs you:
# services sleep after 15 minutes idle, there is no disk (voice clips are re-rendered after a
# restart) and the free database expires after 30 days.
#
# Free services cannot be private and cannot have disks, so the API is a normal web service here and
# the web app reaches it over its public address. Browsers still only talk to the web app, so
# passkeys and cookies belong to the web app's address, exactly as in render.yaml.

databases:
  - name: zolo-db
    databaseName: zolo
    user: zolo
    plan: free

services:
  - type: web
    name: zolo-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /healthz
    # Migrate, seed ONLY if the database is empty (a restart keeps everything), then serve.
    dockerCommand: sh -c "alembic upgrade head && python -m zolo.seed --if-empty && exec uvicorn zolo.api.main:create_app --factory --host 0.0.0.0 --port 8000"
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: zolo-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: DEMO_TOKEN
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: ENV
        value: prod
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_FORWARDED_FOR
        value: "true"
      # The public address of the WEB service, e.g. zolo-web.onrender.com / https://zolo-web.onrender.com
      - key: RP_ID
        sync: false
      - key: ORIGIN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # The voice. Without a key the app still works: the screen reader reads the request.
      - key: YARNGPT_API_KEY
        sync: false
      - key: AUDIO_PRERENDER_ON_CREATE
        value: "true"
      - key: AUDIO_CACHE_DIR
        value: /data/audio
      - key: TTS_VOICE_EN
        value: idera
      - key: TTS_VOICE_PCM
        value: idera

  - type: web
    name: zolo-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    healthCheckPath: /signin
    envVars:
      - key: PORT
        value: "3000"
      # The API's public address, e.g. https://zolo-api.onrender.com
      - key: BACKEND_URL
        sync: false
