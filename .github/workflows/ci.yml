name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zolo
          POSTGRES_PASSWORD: zolo
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zolo" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://zolo:zolo@localhost:5432/zolo_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.4"
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q --cov=zolo --cov-report=term-missing --cov-report=json:coverage.json
      - name: Coverage gate (90% on consent and passkeys, per the PRD)
        run: uv run python -m zolo.tools.check_coverage coverage.json --min 90
      - name: OpenAPI schema is up to date
        run: |
          uv run python -m zolo.api.export_openapi > /tmp/openapi.json
          diff -u openapi.json /tmp/openapi.json || {
            echo "openapi.json is stale: run 'uv run python -m zolo.api.export_openapi > openapi.json', commit it, and regenerate the frontend types."; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/openapi.json

  images:
    # The deployment files must keep working: both images build, and the Caddy config is valid.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -t zolo-api backend
      - name: Build the web image
        run: docker build -t zolo-web frontend
      - name: Validate the Compose file and the Caddy config
        run: |
          cp deploy/.env.example deploy/.env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/; s/^SESSION_SECRET=$/SESSION_SECRET=ci-session-secret-ci-session-secret-ci/; s/^DEMO_TOKEN=$/DEMO_TOKEN=ci-demo-token/' deploy/.env
          docker compose -f deploy/compose.yml --env-file deploy/.env config --quiet
          docker run --rm -e SITE_ADDRESS=zolo.example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile

  images:
    # The deployment images must keep building, and the Caddy config must stay valid.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t zolo-api backend
      - run: docker build -t zolo-web frontend
      - run: docker run --rm -e SITE_ADDRESS=zolo.example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile
