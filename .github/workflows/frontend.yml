name: frontend

on:
  push:
    paths: ["frontend/**", "backend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "backend/**", ".github/workflows/frontend.yml"]

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API types match backend/openapi.json
        run: pnpm gen:api:check
      - name: Type check
        run: pnpm typecheck
      - name: Lint (includes the strict jsx-a11y rules)
        run: pnpm lint
      - name: Formatting
        run: pnpm format:check
      - name: Unit tests
        run: pnpm test
      - name: Production build (default settings)
        run: pnpm build
      - name: Production build for the end-to-end tests (component gallery on)
        run: pnpm build:e2e
      - name: Install Chromium and its system libraries
        run: pnpm e2e:install
      - name: End-to-end and accessibility (axe) tests
        run: pnpm e2e
      - name: Keep the report when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  real-backend:
    # The same journeys against the REAL backend (Postgres, real WebAuthn verification, the real
    # state machine), with Chromium's virtual authenticator playing the phone.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zolo
          POSTGRES_PASSWORD: zolo
          POSTGRES_DB: zolo_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zolo" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --frozen
        working-directory: backend
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build:e2e
        working-directory: frontend
      - run: pnpm e2e:install
        working-directory: frontend
      - name: Passkeys, approval and failure cases against the real backend
        run: pnpm e2e:real
        working-directory: frontend
      - name: Keep the report when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-real
          path: |
            frontend/playwright-report-real
            frontend/test-results
          retention-days: 7

  pr-title:
    # Conventional commits: squash-merge uses the PR title, so that is what is checked.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Check the PR title is a conventional commit
        working-directory: frontend
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$PR_TITLE" | pnpm exec commitlint
